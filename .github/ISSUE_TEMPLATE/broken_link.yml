name: 🐛 Broken Link Report
description: Report a broken or outdated link in the list
title: "Broken Link: [Resource Name]"
labels: ["broken-link", "bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a broken link! This helps us keep the list accurate and useful.

  - type: input
    id: resource-name
    attributes:
      label: Resource Name
      description: The name of the resource with the broken link
      placeholder: e.g., MITRE ATLAS
    validations:
      required: true

  - type: input
    id: broken-url
    attributes:
      label: Broken URL
      description: The current (broken) link
      placeholder: e.g., https://atlas.mitre.org/old-path
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      description: Which section of the README contains this link?
      placeholder: e.g., Red Teaming & Adversarial Testing > Adversarial Attack Taxonomies
    validations:
      required: true

  - type: input
    id: replacement-url
    attributes:
      label: Suggested Replacement URL (if known)
      description: If you know the correct/updated URL, please provide it
      placeholder: e.g., https://atlas.mitre.org/new-path
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional information about the broken link
      placeholder: e.g., The entire domain appears to have moved, or the resource has been deprecated
    validations:
      required: false
