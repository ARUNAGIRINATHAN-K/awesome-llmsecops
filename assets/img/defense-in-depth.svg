<circle cx="761.5" cy="521.5" r="5" fill="#cf222e" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="700" cy="373" r="14" fill="#cf222e"/><text x="700" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
<rect x="1090" y="705" width="280" height="110" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
<circle cx="1114" cy="729" r="12" fill="#cf222e"/><text x="1114" y="734" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
