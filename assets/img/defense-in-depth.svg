<text x="700.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Defense in Depth for LLM Applications</text>
<text x="700.0" y="62" text-anchor="middle" font-size="13" fill="#59636e">Outer layers prevent · inner layers contain, detect and respond · no single control is enough</text>
