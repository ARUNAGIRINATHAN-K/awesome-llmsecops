<circle cx="50" cy="492" r="3" fill="#1a7f37"/><text x="60" y="496" font-size="12" fill="#1f2328">Input validation &amp; length caps</text>
<line x1="1090" y1="460" x2="887.0" y2="460.0" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="5 4"/>
