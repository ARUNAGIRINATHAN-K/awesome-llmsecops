<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>LLM Security Tool Landscape</title>
<desc>Categorized clusters of open-source tools for LLM security operations.</desc>
<style>
:root{--fg:#e6edf3;--mut:#9198a1}
.c1{--c:#58a6ff}.c2{--c:#bc8cff}.c3{--c:#3fb950}.c4{--c:#f0883e}.c5{--c:#f778ba}.c6{--c:#ff7b72}
.fg{fill:var(--fg)}.mut{fill:var(--mut)}.cf{fill:var(--c)}
.card{fill:var(--c);fill-opacity:.07;stroke:var(--c);stroke-width:1.6}
.chip{fill:var(--c);fill-opacity:.14;stroke:var(--c);stroke-width:1.2}
.pill{fill:none;stroke:var(--c);stroke-width:1.2}
.tag{fill:var(--c)}
@media (prefers-color-scheme: light){
:root{--fg:#1f2328;--mut:#59636e}
.c1{--c:#0969da}.c2{--c:#8250df}.c3{--c:#1a7f37}.c4{--c:#bc4c00}.c5{--c:#bf3989}.c6{--c:#cf222e}
}
</style>
